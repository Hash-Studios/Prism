[vars]
R2_PREVIEW_BASE_URL = "https://img.prismwalls.com"
GH_USERNAME = "codenameakshay2"
GH_REPO_WALLS = "prism-walls"
PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=com.hash.prism"
APP_STORE_URL = "https://apps.apple.com/app/id1405860595"
OG_FALLBACK_IMAGE = "https://raw.githubusercontent.com/Hash-Studios/Prism/master/web/public/assets/og/home.jpg"
BROWSER_RENDERING_ACCOUNT_ID = "bc455bbb5c1264123e8565e360dd6da9"
FIREBASE_PROJECT_ID = "prism-wallpapers"
FIREBASE_AUTH_DEBUG = "false"
AI_REQUIRE_CHARGE = "true"
STUDIO_DAILY_BUDGET_USD = "2"
STUDIO_MONTHLY_BUDGET_USD = "60"

[[kv_namespaces]]
binding = "LINKS_KV"
id = "c05f625aeba84fa7a6299894c3004775"
preview_id = "7937369ebc9d450f863783300c08a0ab"

[[kv_namespaces]]
binding = "AI_STATE_KV"
id = "8157a18000dc4db28e629f9bcdd9f560"
preview_id = "c551131a369e4c6a8210161bf6ad01ae"

[[durable_objects.bindings]]
name = "AI_QUOTA_DO"
class_name = "AiQuotaCoordinator"

[[migrations]]
tag = "v1_ai_quota_coordinator"
new_sqlite_classes = ["AiQuotaCoordinator"]

[[r2_buckets]]
binding = "OG_IMAGES"
bucket_name = "prismwalls-og-images"

[[r2_buckets]]
binding = "AI_IMAGES"
bucket_name = "prismwalls-ai-images"

[observability]
[observability.logs]
enabled = true
invocation_logs = true
