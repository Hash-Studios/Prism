name: Deploy website

# The site is a static export, so a new CHANGELOG.md release reaches /changelog only through a deploy.
on:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - 'CHANGELOG.md'
      - 'assets/fonts/Proxima*'
      - '.github/workflows/deploy_web.yml'
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy prismwalls.com
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NEXT_PUBLIC_MIXPANEL_TOKEN: ${{ vars.NEXT_PUBLIC_MIXPANEL_TOKEN }}
    steps:
      - name: Require the Cloudflare token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Add the CLOUDFLARE_API_TOKEN repository secret (Edit Cloudflare Workers template, prismwalls.com zone).'
            exit 1
          fi
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install and test
        run: |
          npm ci
          node --test test/changelog.test.mjs
      - name: Build and deploy
        run: npm run deploy
