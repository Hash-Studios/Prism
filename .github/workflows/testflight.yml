name: TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Build number (e.g. 304)
        required: true
        type: string
      test_notes:
        description: What to test (shown to testers)
        required: false
        default: ""
        type: string

jobs:
  build-and-upload:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r '.flutter' .fvmrc)" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ steps.fvm.outputs.version }}
          pub-cache-key: flutter-pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}

      - name: Install dependencies
        run: make get CI=true

      # This prerequisite is not provisioned by the workflow. It must be the
      # actual Firebase plist for prism-wallpapers / com.hash.prism, never a stub.
      - name: Prepare real iOS Firebase configuration
        env:
          IOS_GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST }}
        run: python3 tool/prepare_release_firebase.py ios --from-environment

      - name: Version sync guard
        run: python3 tool/sync_app_version.py --check

      - name: Setup Ruby & CocoaPods
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false

      - name: Install CocoaPods
        run: sudo gem install cocoapods --no-document

      - name: Install iOS pods
        run: cd ios && pod install --repo-update
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8

      - name: Install Doppler CLI
        run: brew install dopplerhq/cli/doppler

      - name: Import signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$CERTIFICATE_BASE64" | base64 --decode -o $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 \
            -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null

          security list-keychain -d user -s "$KEYCHAIN_PATH"

      # One App Store profile per signed bundle. Every env name ending in
      # PROVISIONING_PROFILE_BASE64 is installed; empty secrets are skipped.
      - name: Install provisioning profiles
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_LIVE_ACTIVITIES_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_LIVE_ACTIVITIES_PROVISIONING_PROFILE_BASE64 }}
        run: |
          python3 tool/ios_ci_signing.py \
            --export-options "$RUNNER_TEMP/ExportOptions.plist" \
            --manifest "$RUNNER_TEMP/provisioning-profiles.json"

      - name: Use manual signing with the installed profiles
        run: |
          gem install xcodeproj --conservative --no-document
          ruby tool/ios_ci_manual_signing.rb ios/Runner.xcodeproj "$RUNNER_TEMP/provisioning-profiles.json"

      - name: Strip alpha from app icon
        run: |
          ICON="ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png"
          ffmpeg -y -i "$ICON" -vf "format=rgb24" -update 1 /tmp/icon_no_alpha.png
          cp /tmp/icon_no_alpha.png "$ICON"

      - name: Build IPA
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN_PRODUCTION }}
          DOPPLER_PROJECT: prism
          DOPPLER_CONFIG: prd
          BUILD_NUMBER: ${{ github.event.inputs.build_number }}
        run: |
          python3 tool/flutter_with_doppler.py --release-platform ios -- \
            flutter build ipa --release --build-number="$BUILD_NUMBER" \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"

      # flutter build ipa exits 0 even when the IPA export fails.
      - name: Check IPA was exported
        run: |
          if [ ! -s build/ios/ipa/Prism.ipa ]; then
            echo "::error::flutter build ipa did not export build/ios/ipa/Prism.ipa. See the Build IPA log."
            exit 1
          fi

      - name: Install asc CLI
        run: brew install rudrankriyam/tap/asc

      - name: Upload to TestFlight (Prism Alpha)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
          ASC_BYPASS_KEYCHAIN: "true"
          TEST_NOTES: ${{ github.event.inputs.test_notes }}
        run: |
          echo "$ASC_PRIVATE_KEY_B64" | base64 --decode > /tmp/AuthKey.p8
          chmod 600 /tmp/AuthKey.p8
          asc auth login \
            --skip-validation \
            --bypass-keychain \
            --name "Prism CI" \
            --key-id "$ASC_KEY_ID" \
            --issuer-id "$ASC_ISSUER_ID" \
            --private-key /tmp/AuthKey.p8

          if [ -n "$TEST_NOTES" ]; then
            asc publish testflight \
              --app 6670200846 \
              --ipa build/ios/ipa/Prism.ipa \
              --group "Prism Alpha" \
              --wait \
              --test-notes "$TEST_NOTES" \
              --locale en-US
          else
            asc publish testflight \
              --app 6670200846 \
              --ipa build/ios/ipa/Prism.ipa \
              --group "Prism Alpha" \
              --wait
          fi

      - name: Cleanup keychain & keys
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true
          if [ -f "$RUNNER_TEMP/provisioning-profiles.json" ]; then
            jq -r '.paths[]' "$RUNNER_TEMP/provisioning-profiles.json" | while IFS= read -r profile; do
              rm -f "$profile"
            done
          fi
          rm -f /tmp/AuthKey.p8 $RUNNER_TEMP/certificate.p12 \
            "$RUNNER_TEMP/provisioning-profiles.json" "$RUNNER_TEMP/ExportOptions.plist"
