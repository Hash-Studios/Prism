name: CI

# Pull requests run only the jobs their changed paths can affect, and a newer
# push cancels the older run. Draft PRs do not run. The `ci` job at the end is
# the required check: it is green when every job that ran passed.
#
# Push jobs warm dependency caches only when their keys change. PRs can read
# master-scoped caches; PR writes would be visible only to that PR.
# Optional app-size comparisons live in app_size.yml and do not affect `ci`.

on:
  pull_request:
    # Drafts are skipped, so the suite has to start when a draft becomes ready.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - master
    # Inputs to the native cache warmers below, not every app-code merge.
    paths:
      - 'android/**'
      - 'packages/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.fvmrc'
      - 'tool/write_firebase_options_stub.sh'
      - 'Makefile'
      # ios_cache_base key.
      - 'ios/Podfile.lock'
      - '.github/workflows/ci.yml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dkotlin.daemon.jvm.options=-Xmx2g -Dorg.gradle.vfs.watch=false

jobs:
  changes:
    name: Detect changes
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      flutter: ${{ steps.filter.outputs.flutter }}
      functions: ${{ steps.filter.outputs.functions }}
      web: ${{ steps.filter.outputs.web }}
      rules: ${{ steps.filter.outputs.rules }}
      android: ${{ steps.filter.outputs.android }}
      ios: ${{ steps.filter.outputs.ios }}
      workflow: ${{ steps.filter.outputs.workflow }}
      notification_contract: ${{ steps.filter.outputs.notification_contract }}
    steps:
      # Reads the PR file list from the API, so no checkout is needed.
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # A `!` pattern excludes paths only with this quantifier. Under the
          # default `some`, a negated pattern matches every other path.
          predicate-quantifier: some-with-excludes
          filters: |
            flutter:
              # Native files stay in. The backend notification-channel input
              # is handled by the small notification_contract job below.
              - '**'
              - '!functions/**'
              - '!web/**'
              - '!demo/**'
              - '!examples/**'
              - '!docs/**'
              - '!.github/**'
              - '!.claude/**'
              - '!.agents/**'
              - '!**/*.md'
              - '!metadata/**'
              - '!firestore.rules'
              - '!firestore.indexes.json'
            functions:
              - 'functions/**'
            notification_contract:
              - 'functions/src/*.ts'
              - 'lib/core/startup/notification_channels.dart'
              - 'test/core/startup/notification_channels_test.dart'
              - 'tool/notification_contract_fixture_test.py'
              - 'lib/l10n/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - '.fvmrc'
            web:
              - 'web/**'
              - 'infra/cloudflare/worker/**'
              # The changelog pages and share cards build from these.
              - 'CHANGELOG.md'
              - 'assets/fonts/Proxima*'
              - '.github/workflows/deploy_web.yml'
            rules:
              - 'firestore.rules'
              - 'firebase.json'
              - 'tool/firestore_rules_smoke.mjs'
            android:
              - 'android/**'
              - '!**/*.md'
              - 'packages/**/android/**'
              - 'packages/**/pubspec.yaml'
              - 'packages/**/pubspec.lock'
              - 'pigeons/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - '.fvmrc'
              - 'Makefile'
              - 'tool/write_firebase_options_stub.sh'
            ios:
              - 'ios/**'
              - '!**/*.md'
              - 'packages/**/ios/**'
              - 'packages/**/darwin/**'
              - 'packages/**/native_tests/**'
              - 'packages/**/pubspec.yaml'
              - 'packages/**/pubspec.lock'
              - 'pigeons/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - '.fvmrc'
              - 'Makefile'
              - 'tool/write_firebase_options_stub.sh'
            workflow:
              - '.github/workflows/ci.yml'
              - '.github/workflows/app_size.yml'

  flutter:
    name: Flutter static verify
    needs: changes
    if: needs.changes.outputs.flutter == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read Flutter version from .fvmrc
        id: fvm
        run: echo "version=$(jq -r '.flutter' .fvmrc)" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ steps.fvm.outputs.version }}
          pub-cache-key: flutter-pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}

      - name: Generate Firebase options stub for CI
        run: tool/write_firebase_options_stub.sh

      # tool/cloudflare-worker-check.sh needs Node 22.6+.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run static CI gate
        run: make ci-static CI=true
      - name: Exercise missing-channel regression fixture
        if: needs.changes.outputs.notification_contract == 'true' || needs.changes.outputs.workflow == 'true'
        run: make notification-contract-fixture-test CI=true

  flutter_tests:
    name: Flutter tests (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.flutter == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - name: Read Flutter version
        id: fvm
        run: echo "version=$(jq -r '.flutter' .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ steps.fvm.outputs.version }}
          pub-cache-key: flutter-pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
      - run: tool/write_firebase_options_stub.sh
      - name: Run test shard
        # A half-hour zone, not UTC, so a test that assumes UTC fails here as it does on a developer machine.
        env:
          TZ: Asia/Kolkata
        run: make test-shard CI=true TEST_TOTAL_SHARDS=2 TEST_SHARD_INDEX=${{ matrix.shard }}

  notification_contract:
    name: Notification-channel contract
    needs: changes
    if: needs.changes.outputs.notification_contract == 'true' && needs.changes.outputs.flutter != 'true' && needs.changes.outputs.workflow != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Read Flutter version
        id: fvm
        run: echo "version=$(jq -r '.flutter' .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ steps.fvm.outputs.version }}
          pub-cache-key: flutter-pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
      # The test compiles lib/main.dart, which imports the gitignored firebase_options.dart.
      - run: tool/write_firebase_options_stub.sh
      - name: Check notification-channel contract
        run: flutter test test/core/startup/notification_channels_test.dart
      - name: Exercise missing-channel regression fixture
        run: FLUTTER=flutter python3 tool/notification_contract_fixture_test.py

  android:
    name: Android native verify
    needs: changes
    if: needs.changes.outputs.android == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Read Flutter version
        id: fvm
        run: echo "version=$(jq -r '.flutter' .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true
          # Share master's Flutter caches on a hit. Misses can still save a PR-scoped copy.
          cache-key: flutter-${{ runner.os }}-${{ steps.fvm.outputs.version }}
          pub-cache-key: flutter-pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
      - name: Restore Gradle
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-native-v2-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'packages/**/android/**/*.gradle*', 'pubspec.lock', '.fvmrc') }}
          restore-keys: |
            gradle-native-v2-${{ runner.os }}-
      - run: tool/write_firebase_options_stub.sh
      - run: make native-android-check CI=true

  ios:
    name: iOS native verify
    needs: changes
    if: needs.changes.outputs.ios == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: macos-26
    # Warm (cache from ios_cache_base): about 8 minutes. A PR that changes ios/Podfile.lock,
    # pubspec.lock or .fvmrc builds cold: 15 to more than 20 minutes on busy macOS runners.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
      - name: Read Flutter version
        id: fvm
        run: echo "version=$(jq -r '.flutter' .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ steps.fvm.outputs.version }}
          pub-cache-key: flutter-pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
      # Pods and Xcode's compilation cache (content-keyed, so new file times do not force a
      # rebuild). Only ios_cache_base saves it.
      - uses: actions/cache/restore@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
            build/ios/native-tests
          key: ios-build-v2-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock', 'pubspec.lock', '.fvmrc') }}
      - run: tool/write_firebase_options_stub.sh
      - run: make native-ios-check CI=true

  functions:
    name: Functions verify
    needs: changes
    if: needs.changes.outputs.functions == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install, build, lint, and test
        run: |
          npm ci
          npm run build
          npm run lint
          node --test lib/__tests__/*.test.js
      - name: Setup Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify real Firestore transactions
        working-directory: .
        timeout-minutes: 5
        run: >-
          timeout 240s npx --yes firebase-tools@15.15.0 emulators:exec
          --only firestore --project demo-prism-functions
          "node --test --test-timeout=120000
          functions/lib/__tests__/favouriteTransactionsEmulator.test.js
          functions/lib/__tests__/onUserCreated.test.js
          functions/lib/__tests__/claimUsername.test.js
          functions/lib/__tests__/deleteAccount.test.js
          functions/lib/__tests__/promoCodesEmulator.test.js
          functions/lib/__tests__/wrappedEmulator.test.js"

  web:
    name: Web verify
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.workflow == 'true'
    # This image includes Google Chrome. Playwright uses its supported Chrome
    # channel, avoiding a browser + OS-font download on every fresh runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PLAYWRIGHT_CHROMIUM_CHANNEL: chrome
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check installed browser
        run: google-chrome --version
      - name: Run unit tests
        run: |
          node --test test/analytics.test.cjs
          node --test test/changelog.test.mjs
      - name: Run browser tests
        run: npm run test:e2e
      # Next.js filters diagnostics from test/spec files; Playwright does not typecheck.
      - name: Typecheck all TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  rules:
    name: Firestore rules verify
    needs: changes
    if: needs.changes.outputs.rules == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-15.15.0
      - name: Firestore rules smoke test
        run: npx --yes firebase-tools@15.15.0 emulators:exec --only firestore --project demo-prism "node tool/firestore_rules_smoke.mjs"

  repo_assets:
    name: Repository assets guard
    needs: changes
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Check repository assets
        run: make repo-assets-check
      - name: Check store listing limits
        run: make store-listings-check

  ios_cache_base:
    name: iOS build cache (master)
    if: github.event_name == 'push'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Read Flutter version
        id: fvm
        run: echo "version=$(jq -r '.flutter' .fvmrc)" >> "$GITHUB_OUTPUT"
      - name: Check for a cached build
        id: cached
        uses: actions/cache/restore@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
            build/ios/native-tests
          key: ios-build-v2-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock', 'pubspec.lock', '.fvmrc') }}
          lookup-only: true
      - name: Select Xcode 26.6
        if: steps.cached.outputs.cache-hit != 'true'
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
      - if: steps.cached.outputs.cache-hit != 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ steps.fvm.outputs.version }}
          pub-cache-key: flutter-pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
      - if: steps.cached.outputs.cache-hit != 'true'
        run: tool/write_firebase_options_stub.sh
      - if: steps.cached.outputs.cache-hit != 'true'
        run: make native-ios-check CI=true
      - if: steps.cached.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
            build/ios/native-tests
          key: ${{ steps.cached.outputs.cache-primary-key }}

  android_cache_base:
    name: Android dependency cache (master)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check for cached Gradle dependencies
        id: cached
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-native-v2-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'packages/**/android/**/*.gradle*', 'pubspec.lock', '.fvmrc') }}
          lookup-only: true
      - name: Restore previous Gradle dependencies
        if: steps.cached.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.cached.outputs.cache-primary-key }}
          restore-keys: |
            gradle-native-v2-${{ runner.os }}-
      - uses: actions/setup-java@v4
        if: steps.cached.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: '21'
      - name: Read Flutter version
        id: fvm
        if: steps.cached.outputs.cache-hit != 'true'
        run: echo "version=$(jq -r '.flutter' .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        if: steps.cached.outputs.cache-hit != 'true'
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ steps.fvm.outputs.version }}
          pub-cache-key: flutter-pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
      - name: Warm native dependencies
        if: steps.cached.outputs.cache-hit != 'true'
        run: |
          make native-android-check CI=true
          ./android/gradlew --stop
      - name: Save Gradle
        if: steps.cached.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.cached.outputs.cache-primary-key }}

  ci:
    name: ci
    needs: [changes, flutter, flutter_tests, notification_contract, android, ios, functions, web, rules, repo_assets]
    # `always()` so a cancelled or failed job reports red. A skipped required
    # check counts as passed, so `ci` must never skip on a non-draft PR.
    if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate results
        env:
          RESULTS: ${{ needs.changes.result }} ${{ needs.flutter.result }} ${{ needs.flutter_tests.result }} ${{ needs.notification_contract.result }} ${{ needs.android.result }} ${{ needs.ios.result }} ${{ needs.functions.result }} ${{ needs.web.result }} ${{ needs.rules.result }} ${{ needs.repo_assets.result }}
        run: |
          echo "changes flutter flutter_tests notification_contract android ios functions web rules repo_assets: $RESULTS"
          [ "${{ needs.changes.result }}" = success ] || { echo 'Detect changes failed.'; exit 1; }
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo 'A required job failed.'; exit 1 ;;
            esac
          done
