allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.layout.buildDirectory.set(file('../build'))
subprojects {
    project.layout.buildDirectory.set(rootProject.layout.buildDirectory.dir(project.name))
    project.evaluationDependsOn(':app')

    project.plugins.withId("com.android.library") {
        // Flutter plugins still need external Kotlin while builtInKotlin is disabled.
        if (project.file("src/main/kotlin").exists()) {
            project.pluginManager.apply("org.jetbrains.kotlin.android")
            project.extensions.getByName("kotlin").compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
        }
        project.extensions.getByName("androidComponents").finalizeDsl { ext ->
            if (ext.compileSdk != null && ext.compileSdk < 37) {
                ext.compileSdk = 37
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
