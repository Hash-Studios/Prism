plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'dev.flutter.flutter-gradle-plugin'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.hash.prism"
    compileSdkVersion 37
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        disable 'InvalidPackage'
    }

    defaultConfig {
        applicationId "com.hash.prism"
        minSdkVersion 24
        targetSdkVersion 36
        testInstrumentationRunner 'com.hash.prism.PrismNativeInstrumentation'
        versionCode flutter.versionCode
        versionName flutter.versionName

        def targetPlatforms = project.findProperty('target-platform')?.toString()
        def splitPerAbi = project.findProperty('split-per-abi')?.toString()?.toBoolean() ?: false
        if (targetPlatforms != null && !splitPerAbi) {
            def platformAbis = [
                    'android-arm': 'armeabi-v7a',
                    'android-arm64': 'arm64-v8a',
                    'android-x64': 'x86_64'
            ]
            ndk {
                abiFilters.clear()
                abiFilters.addAll(targetPlatforms.split(',').collect { platform ->
                    def abi = platformAbis[platform]
                    if (abi == null) {
                        throw new GradleException("Unsupported Flutter target platform: $platform")
                    }
                    abi
                })
            }
        }
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            optimization {
                keepRules {
                    // Its consumer rules add -dontoptimize. purchases_flutter already keeps com.amazon.**.
                    ignoreFrom("com.revenuecat.purchases:purchases-store-amazon")
                }
            }
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    testImplementation 'junit:junit:4.13.2'
}

flutter {
    source '../..'
}

if (file("google-services.json").exists()) {
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.lifecycle("google-services.json not found, skipping Google Services plugin for local builds.")
}
